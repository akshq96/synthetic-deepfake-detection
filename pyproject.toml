[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfake-detection"
version = "0.1.0"
description = "Synthetic Data-Augmented Deepfake Detection — research pipeline"
requires-python = ">=3.10"
readme = "README.md"

# Core deps needed by the data pipeline (Phase 1). Torch/timm/XAI/backend deps
# are split into optional groups below so early phases stay light to install,
# and so Colab/Kaggle installs (which preinstall torch) can skip the "torch" group.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "opencv-python-headless>=4.9",
    # Exact-pinned: the legacy `solutions.face_detection` API this project uses
    # was removed somewhere between 0.10.14 and 0.10.35 (and again replaced by
    # a Tasks-only API in 1.0+, whose face-detector graph crashes hard — native
    # abort, not a catchable exception — on macOS in this dev environment). 0.10.14
    # is the newest version verified here to expose `solutions` without crashing;
    # see docs/methodology.md note on face detector choice once written.
    "mediapipe==0.10.14",
    "pillow>=10.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9.16",
]
xai = [
    "grad-cam>=1.5.0",
]
eval = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
]
tracking = [
    "mlflow>=2.12",
]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "psutil>=5.9",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]
full = [
    "deepfake-detection[torch,xai,eval,tracking,backend,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
